  }
  .recovery-plan-selected {
    border-color: oklch(0.596 0.145 163.225);
    @supports (color: color-mix(in lab, red, red)) {
      border-color: color-mix(in oklab, oklch(0.596 0.145 163.225) 58%, var(--border));
    }
    background: oklch(0.962 0.044 156.743);
    @supports (color: color-mix(in lab, red, red)) {
      background: color-mix(in oklab, oklch(0.962 0.044 156.743) 45%, var(--background));
    }
    box-shadow: 0 0 0 1px color-mix(in oklab, oklch(0.596 0.145 163.225) 25%, transparent);
  }
  .staffing-grid td + td, .staffing-grid th + th {
    border-left: 1px solid var(--border);
    @supports (color: color-mix(in lab, red, red)) {
      border-left: 1px solid color-mix(in oklab, var(--border) 72%, transparent);
    }
  }
  .timetable-input, .timetable-add {
    min-height: 2rem;
    border: 1px solid transparent;
    border-radius: calc(var(--radius) * 0.75);
    background: transparent;
    padding: 0.375rem 0.5rem;
    color: var(--foreground);
    transition: border-color 140ms ease, background-color 140ms ease, box-shadow 140ms ease;
  }
  .timetable-input:hover, .timetable-add:hover {
    border-color: var(--border);
    background: var(--background);
  }
  .timetable-input:focus, .timetable-add:focus {
    border-color: var(--ring);
    background: var(--background);
    box-shadow: 0 0 0 2px var(--ring);
    @supports (color: color-mix(in lab, red, red)) {
      box-shadow: 0 0 0 2px color-mix(in oklab, var(--ring) 24%, transparent);
    }
    outline: none;
  }
  .timetable-add {
    border-color: var(--border);
    color: var(--muted-foreground);
    font-size: 0.6875rem;
  }
}
@media (prefers-reduced-motion: no-preference) {
  .dashboard .icon-trigger:not(:disabled):not([aria-disabled="true"]):focus-visible .animated-icon {
    animation: var(--icon-animation) 420ms ease-in-out;
  }
  @media (hover: hover) {
    .dashboard .icon-trigger:not(:disabled):not([aria-disabled="true"]):hover .animated-icon {
      animation: var(--icon-animation) 420ms ease-in-out;
    }
  }
}
@media (prefers-reduced-motion: reduce) {
  .dashboard .animated-icon {
    animation: none;
  }
}
@keyframes icon-lift {
  0%, 100% {
    transform: translateY(0);
  }
  45% {
    transform: translateY(-3px);
  }
}
@keyframes icon-tilt {
  0%, 100% {
    transform: rotate(0deg);
  }
  30% {
    transform: rotate(-10deg);
  }
  65% {
    transform: rotate(8deg);
  }
}
@keyframes icon-pulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.12);
  }
}
@keyframes icon-turn {
  0%, 100% {
    transform: rotate(0deg);
  }
  50% {
    transform: rotate(20deg);
  }
}
@keyframes icon-slide {
  0%, 100% {
    transform: translateX(0);
  }
  50% {
    transform: translateX(3px);
  }
}
@keyframes icon-pop {
  0%, 100% {
    transform: translateY(0) scale(1);
  }
  50% {
    transform: translateY(-2px) scale(1.08);
  }
}
